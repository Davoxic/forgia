name: Build IPA (unsigned)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project Forgia.xcodeproj \
            -scheme Forgia \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build (Release, no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Forgia.xcodeproj \
            -scheme Forgia \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package into .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Forgia.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Forgia.app non trovata in $APP_PATH"
            find build -name "*.app" -maxdepth 6 -print || true
            exit 1
          fi
          echo "Contenuto del bundle:"
          ls -la "$APP_PATH"
          echo "Frameworks incorporati:"
          ls -la "$APP_PATH/Frameworks" 2>/dev/null || echo "  (nessuno)"

          rm -rf Payload Forgia-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # Via ogni residuo di firma: l'ipa esce volutamente non firmato.
          rm -rf "Payload/Forgia.app/_CodeSignature" "Payload/Forgia.app/embedded.mobileprovision"
          find Payload -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          zip -qry Forgia-unsigned.ipa Payload
          ls -lh Forgia-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forgia-unsigned-ipa
          path: Forgia-unsigned.ipa
          if-no-files-found: error
          retention-days: 90
